<script>
    // ============================================================
    // 1. CONFIGURACIÓN DE FIREBASE (SIMPLIFICADA)
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyArpLZEujMXkXYYn8B1WyXH5jGMnBQhQUY",
        authDomain: "generacionahimaas.firebaseapp.com",
        databaseURL: "https://generacionahimaas-default-rtdb.firebaseio.com",
        projectId: "generacionahimaas",
        storageBucket: "generacionahimaas.firebasestorage.app",
        messagingSenderId: "854884058832",
        appId: "1:854884058832:web:3946c71c4e33ff37f840d5"
    };

    let firebaseApp, database;
    let firebaseReady = false;

    try {
        firebaseApp = firebase.initializeApp(firebaseConfig);
        database = firebase.database();
        firebaseReady = true;
        console.log('🔥 Firebase conectado correctamente');
    } catch (e) {
        console.warn('⚠️ Firebase no disponible', e);
        firebaseReady = false;
    }

    // ============================================================
    // 2. DATA PRINCIPAL
    // ============================================================
    let data = {
        disciplinas: ['Atletismo', 'Natación', 'Fútbol', 'Baloncesto', 'Voleibol', 'Tenis'],
        categorias: ['Infantil', 'Juvenil', 'Adulto', 'Máster'],
        atletas: [],
        noticias: [],
        infoItems: [],
        homeContent: {
            title: 'OLIMPIADAS 2026 · AVCS',
            subtitle: 'Fe, Disciplina y Excelencia Deportiva',
            statYears: '15',
            statCoaches: 'Entrenadores certificados',
            statFacilities: 'Instalaciones modernas',
            card1Title: '500+',
            card1Desc: 'Atletas inscritos',
            card2Title: '20+',
            card2Desc: 'Entrenadores profesionales',
            card3Title: '🏅 Entrenamiento de Élite',
            card3Desc: 'Técnica avanzada y preparación física de alto rendimiento.',
            card4Title: '🔥 Competencia y Fe',
            card4Desc: 'Formando atletas con valores y espíritu de superación.',
            btnText: 'Inscríbete ahora'
        },
        sliderImages: [
            'https://images.unsplash.com/photo-1534430480872-5d04dc3d84e7?w=1200&h=600&fit=crop&crop=center',
            'https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?w=1200&h=600&fit=crop&crop=center',
            'https://images.unsplash.com/photo-1461896836934-b0b52d5d3997?w=1200&h=600&fit=crop&crop=center',
            'https://images.unsplash.com/photo-1517649763962-0c623066013b?w=1200&h=600&fit=crop&crop=center'
        ]
    };

    let currentRole = 'coordinator';
    let isAdmin = false;
    let nextId = 3;
    let nextInfoId = 1;
    let nextNewsId = 100;
    let isFirebaseListenerActive = false;

    // ============================================================
    // 3. FUNCIÓN SEGURA PARA ACTUALIZAR UI
    // ============================================================
    function safeSetText(id, text) {
        const el = document.getElementById(id);
        if (el) el.textContent = text;
    }

    // ============================================================
    // 4. PERSISTENCIA (VERSIÓN SIMPLIFICADA)
    // ============================================================
    function saveDataToFirebase() {
        if (!firebaseReady || !database) return;
        try {
            const ref = database.ref('olimpiadas2026_v2');
            ref.update({
                disciplinas: data.disciplinas,
                categorias: data.categorias,
                atletas: data.atletas,
                noticias: data.noticias,
                infoItems: data.infoItems,
                homeContent: data.homeContent,
                sliderImages: data.sliderImages
            }).catch(err => console.warn('⚠️ Error al guardar:', err));
        } catch (e) {
            console.warn('⚠️ Error en saveDataToFirebase:', e);
        }
    }

    function loadDataFromFirebase(callback) {
        if (!firebaseReady || !database) {
            loadDataFromLocalStorage();
            if (callback) callback();
            return;
        }
        try {
            const ref = database.ref('olimpiadas2026_v2');
            ref.once('value', (snapshot) => {
                const val = snapshot.val();
                if (val) {
                    data.disciplinas = val.disciplinas || data.disciplinas;
                    data.categorias = val.categorias || data.categorias;
                    data.atletas = val.atletas || [];
                    data.noticias = val.noticias || [];
                    data.infoItems = val.infoItems || [];
                    data.homeContent = val.homeContent || data.homeContent;
                    data.sliderImages = val.sliderImages || data.sliderImages;
                    if (data.atletas.length > 0) {
                        const maxId = Math.max(...data.atletas.map(a => a.id || 0));
                        nextId = maxId + 1;
                    }
                    if (data.infoItems.length > 0) {
                        const maxInfoId = Math.max(...data.infoItems.map(i => i.id || 0));
                        nextInfoId = maxInfoId + 1;
                    }
                    saveDataToLocalStorage();
                    if (callback) callback();
                } else {
                    loadDataFromLocalStorage();
                    setTimeout(() => saveDataToFirebase(), 500);
                    if (callback) callback();
                }
            }).catch((err) => {
                console.warn('⚠️ Error al cargar:', err);
                loadDataFromLocalStorage();
                if (callback) callback();
            });
        } catch (e) {
            console.warn('⚠️ Error en loadDataFromFirebase:', e);
            loadDataFromLocalStorage();
            if (callback) callback();
        }
    }

    function listenFirebaseChanges() {
        if (!firebaseReady || !database || isFirebaseListenerActive) return;

        try {
            const ref = database.ref('olimpiadas2026_v2');
            ref.on('value', (snapshot) => {
                const val = snapshot.val();
                if (!val) return;

                data.disciplinas = val.disciplinas || data.disciplinas;
                data.categorias = val.categorias || data.categorias;
                data.atletas = val.atletas || [];
                data.noticias = val.noticias || [];
                data.infoItems = val.infoItems || [];
                data.homeContent = val.homeContent || data.homeContent;
                data.sliderImages = val.sliderImages || data.sliderImages;

                if (data.atletas.length > 0) {
                    const maxId = Math.max(...data.atletas.map(a => a.id || 0));
                    nextId = maxId + 1;
                }
                if (data.infoItems.length > 0) {
                    const maxInfoId = Math.max(...data.infoItems.map(i => i.id || 0));
                    nextInfoId = maxInfoId + 1;
                }

                saveDataToLocalStorage();
                applyHomeContent();
                renderInfo();
                renderAthletes();
                renderAdminAthletes();
                renderNoticias();
                renderInfoList();
                updateSliderImages();
                populateSelectors();
                console.log('🔄 Datos actualizados en tiempo real');
            });
            isFirebaseListenerActive = true;
            console.log('👂 Listener activado');
        } catch (e) {
            console.warn('⚠️ Error al activar listener:', e);
        }
    }

    function saveDataToLocalStorage() {
        try {
            localStorage.setItem('olimpiadas2026_data_v7', JSON.stringify(data));
        } catch (e) {}
    }

    function loadDataFromLocalStorage() {
        try {
            const stored = localStorage.getItem('olimpiadas2026_data_v7');
            if (stored) {
                const parsed = JSON.parse(stored);
                data.disciplinas = parsed.disciplinas || data.disciplinas;
                data.categorias = parsed.categorias || data.categorias;
                data.atletas = parsed.atletas || [];
                data.noticias = parsed.noticias || [];
                data.infoItems = parsed.infoItems || [];
                data.homeContent = parsed.homeContent || data.homeContent;
                data.sliderImages = parsed.sliderImages || data.sliderImages;
                if (data.atletas.length > 0) {
                    const maxId = Math.max(...data.atletas.map(a => a.id || 0));
                    nextId = maxId + 1;
                }
                if (data.infoItems.length > 0) {
                    const maxInfoId = Math.max(...data.infoItems.map(i => i.id || 0));
                    nextInfoId = maxInfoId + 1;
                }
            } else {
                data.atletas = [{
                    id: 1,
                    nombre: 'Carlos',
                    apellido: 'Pérez',
                    edad: 22,
                    cedula: '12345678',
                    categoria: 'Adulto',
                    disciplina: 'Atletismo',
                    zona: 'Zona 1',
                    foto: ''
                }, {
                    id: 2,
                    nombre: 'Lucía',
                    apellido: 'Gómez',
                    edad: 17,
                    cedula: '87654321',
                    categoria: 'Juvenil',
                    disciplina: 'Natación',
                    zona: 'Zona 2',
                    foto: ''
                }];
                data.noticias = [{
                    id: 1,
                    title: 'Inauguración de las Olimpiadas AVCS 2026',
                    content: 'El próximo 15 de agosto daremos inicio al evento deportivo más importante del año.',
                    date: new Date().toLocaleDateString()
                }];
                data.infoItems = [{
                    id: 1,
                    title: 'Bienvenidos a las Olimpiadas AVCS 2026',
                    desc: 'Las Olimpiadas AVCS son el evento deportivo más importante de la región.',
                    link: 'https://olimpiadasavcs.com',
                    linkText: 'Conoce más',
                    image: 'https://images.unsplash.com/photo-1461896836934-b0b52d5d3997?w=800&h=400&fit=crop'
                }];
                nextId = 3;
                nextInfoId = 2;
                saveDataToLocalStorage();
            }
        } catch (e) {}
    }

    function saveData() {
        saveDataToLocalStorage();
        saveDataToFirebase();
    }

    // ============================================================
    // 5. MENÚ HAMBURGUESA
    // ============================================================
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const navMenu = document.getElementById('navMenu');

    hamburgerBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        this.classList.toggle('active');
        navMenu.classList.toggle('open');
    });

    document.querySelectorAll('.nav-menu a, .nav-menu .btn-login').forEach(item => {
        item.addEventListener('click', function() {
            hamburgerBtn.classList.remove('active');
            navMenu.classList.remove('open');
        });
    });

    // ============================================================
    // 6. NAVEGACIÓN
    // ============================================================
    const sections = {
        home: document.getElementById('section-home'),
        info: document.getElementById('section-info'),
        athletes: document.getElementById('section-athletes'),
        admin: document.getElementById('section-admin')
    };
    const navLinks = document.querySelectorAll('.nav-menu a[data-section]');
    const adminMenuLink = document.getElementById('adminMenuLink');

    function showSection(sectionId) {
        Object.keys(sections).forEach(key => {
            if (sections[key]) {
                sections[key].classList.toggle('active', key === sectionId);
            }
        });
        navLinks.forEach(link => {
            link.classList.toggle('active', link.dataset.section === sectionId);
        });
        if (sectionId === 'athletes') renderAthletes();
        if (sectionId === 'info') renderInfo();
        if (sectionId === 'home') applyHomeContent();
        hamburgerBtn.classList.remove('active');
        navMenu.classList.remove('open');
    }

    navLinks.forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            showSection(this.dataset.section);
        });
    });

    // ============================================================
    // 7. LOGIN
    // ============================================================
    const loginModal = document.getElementById('loginModal');
    const loginBtn = document.getElementById('loginBtn');
    const closeLogin = document.getElementById('closeLogin');

    loginBtn.addEventListener('click', () => loginModal.classList.add('show'));
    closeLogin.addEventListener('click', () => loginModal.classList.remove('show'));
    loginModal.addEventListener('click', (e) => {
        if (e.target === loginModal) loginModal.classList.remove('show');
    });

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const user = document.getElementById('loginUser').value.trim();
        const pass = document.getElementById('loginPass').value.trim();
        const role = document.getElementById('loginRole').value;

        let valid = false;
        if (role === 'coordinator' && pass === 'coord2026') valid = true;
        if (role === 'official' && pass === 'oficial2026') valid = true;

        if (user === 'admin' && valid) {
            isAdmin = true;
            currentRole = role;
            loginModal.classList.remove('show');
            adminMenuLink.style.display = 'inline';
            showSection('admin');
            loadAdminData();
            updateAdminTabs();
            alert(`✅ Acceso concedido como ${role === 'coordinator' ? 'Coordinador' : 'Oficial'}`);
        } else {
            alert('❌ Usuario o contraseña incorrectos para el rol seleccionado.');
        }
    });

    // ============================================================
    // 8. SLIDER
    // ============================================================
    const slides = document.querySelectorAll('.slide');
    const dots = document.querySelectorAll('.dot');
    const prevBtn = document.getElementById('prevSlide');
    const nextBtn = document.getElementById('nextSlide');
    let currentIndex = 0;

    function updateSliderImages() {
        slides.forEach((slide, i) => {
            if (data.sliderImages && data.sliderImages[i]) {
                slide.style.backgroundImage = `url('${data.sliderImages[i]}')`;
            }
        });
    }

    function showSlide(index) {
        if (index < 0) index = slides.length - 1;
        if (index >= slides.length) index = 0;
        slides.forEach((s, i) => s.classList.toggle('active', i === index));
        dots.forEach((d, i) => d.classList.toggle('active', i === index));
        currentIndex = index;
    }

    if (prevBtn && nextBtn) {
        prevBtn.addEventListener('click', () => showSlide(currentIndex - 1));
        nextBtn.addEventListener('click', () => showSlide(currentIndex + 1));
    }
    dots.forEach((dot, idx) => dot.addEventListener('click', () => showSlide(idx)));

    let slideInterval = setInterval(() => showSlide(currentIndex + 1), 5000);
    const slider = document.getElementById('heroSlider');
    if (slider) {
        slider.addEventListener('mouseenter', () => clearInterval(slideInterval));
        slider.addEventListener('mouseleave', () => {
            slideInterval = setInterval(() => showSlide(currentIndex + 1), 5000);
        });
    }

    // ============================================================
    // 9. HOME CONTENT
    // ============================================================
    function applyHomeContent() {
        const hc = data.homeContent;
        if (!hc) return;

        safeSetText('homeTitle', hc.title || 'OLIMPIADAS 2026 · AVCS');
        safeSetText('homeSubtitle', hc.subtitle || 'Fe, Disciplina y Excelencia Deportiva');
        safeSetText('statYears', hc.statYears || '15');
        safeSetText('statCoaches', hc.statCoaches || 'Entrenadores certificados');
        safeSetText('statFacilities', hc.statFacilities || 'Instalaciones modernas');
        safeSetText('card1Title', hc.card1Title || '500+');
        safeSetText('card1Desc', hc.card1Desc || 'Atletas inscritos');
        safeSetText('card2Title', hc.card2Title || '20+');
        safeSetText('card2Desc', hc.card2Desc || 'Entrenadores profesionales');
        safeSetText('card3Title', hc.card3Title || '🏅 Entrenamiento de Élite');
        safeSetText('card3Desc', hc.card3Desc || 'Técnica avanzada y preparación física de alto rendimiento.');
        safeSetText('card4Title', hc.card4Title || '🔥 Competencia y Fe');
        safeSetText('card4Desc', hc.card4Desc || 'Formando atletas con valores y espíritu de superación.');
        safeSetText('homeBtnText', hc.btnText || 'Inscríbete ahora');
    }

    // ============================================================
    // 10. INFO
    // ============================================================
    function renderInfo() {
        const container = document.getElementById('infoContainer');
        if (!container) return;
        let html = '';

        if (data.infoItems && data.infoItems.length > 0) {
            data.infoItems.forEach(item => {
                html += `
                    <div class="info-card">
                        ${item.image ? `<img src="${item.image}" alt="${item.title}" />` : ''}
                        <div class="info-body">
                            <h3>${item.title}</h3>
                            <p>${item.desc}</p>
                            ${item.link ? `<a href="${item.link}" target="_blank" class="info-link">${item.linkText || 'Ver más'} <i class="fas fa-arrow-right"></i></a>` : ''}
                        </div>
                    </div>
                `;
            });
        }

        if (data.noticias && data.noticias.length > 0) {
            html += `<div style="margin-top:24px;"><h3 style="color:#4ade80; margin-bottom:16px;">📰 Últimas Noticias</h3>`;
            data.noticias.forEach(n => {
                html += `
                    <div class="news-item" style="border-left-color: #22d3ee;">
                        <div class="news-content">
                            <h4>${n.title}</h4>
                            <p>${n.content}</p>
                            <span class="news-date">${n.date || ''}</span>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
        }

        container.innerHTML = html || '<div class="empty-message">No hay información disponible.</div>';
    }

    function renderInfoList() {
        const container = document.getElementById('infoList');
        if (!container) return;

        if (!data.infoItems || data.infoItems.length === 0) {
            container.innerHTML = '<div class="empty-message">No hay secciones de información creadas.</div>';
            return;
        }

        container.innerHTML = data.infoItems.map(item => `
            <div class="info-card" style="padding:16px 20px;">
                <div class="info-body" style="padding:0;">
                    <h4 style="font-size:1.1rem; color:#e8edf5; margin-bottom:4px;">${item.title}</h4>
                    <p style="color:#b0c4de; font-size:0.9rem; margin-bottom:8px;">${item.desc.substring(0, 100)}${item.desc.length > 100 ? '...' : ''}</p>
                    ${item.image ? `<div style="margin-bottom:8px;"><img src="${item.image}" style="max-height:60px; border-radius:8px; object-fit:cover;" /></div>` : ''}
                    <div class="info-item-actions">
                        <button class="edit-info-btn" onclick="editInfoItem(${item.id})"><i class="fas fa-edit"></i> Editar</button>
                        <button class="delete-info-btn" onclick="deleteInfoItem(${item.id})"><i class="fas fa-trash"></i> Eliminar</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    window.editInfoItem = function(id) {
        if (currentRole === 'coordinator') {
            alert('⚠️ Los coordinadores no pueden editar información.');
            return;
        }
        const item = data.infoItems.find(i => i.id === id);
        if (!item) return;

        document.getElementById('editInfoId').value = id;
        document.getElementById('editInfoTitle').value = item.title || '';
        document.getElementById('editInfoDesc').value = item.desc || '';
        document.getElementById('editInfoLink').value = item.link || '';
        document.getElementById('editInfoLinkText').value = item.linkText || '';
        document.getElementById('editInfoImage').value = '';

        document.getElementById('editInfoModal').classList.add('show');
    };

    document.getElementById('editInfoForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const id = parseInt(document.getElementById('editInfoId').value);
        const item = data.infoItems.find(i => i.id === id);
        if (!item) return;

        item.title = document.getElementById('editInfoTitle').value.trim();
        item.desc = document.getElementById('editInfoDesc').value.trim();
        item.link = document.getElementById('editInfoLink').value.trim();
        item.linkText = document.getElementById('editInfoLinkText').value.trim();

        const imageInput = document.getElementById('editInfoImage');
        if (imageInput.files && imageInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                item.image = e.target.result;
                saveData();
                renderInfo();
                renderInfoList();
                document.getElementById('editInfoModal').classList.remove('show');
                alert('✅ Información actualizada.');
            };
            reader.readAsDataURL(imageInput.files[0]);
        } else {
            saveData();
            renderInfo();
            renderInfoList();
            document.getElementById('editInfoModal').classList.remove('show');
            alert('✅ Información actualizada.');
        }
    });

    window.deleteInfoItem = function(id) {
        if (currentRole === 'coordinator') {
            alert('⚠️ Los coordinadores no pueden eliminar información.');
            return;
        }
        if (confirm('¿Eliminar esta sección de información?')) {
            data.infoItems = data.infoItems.filter(i => i.id !== id);
            saveData();
            renderInfo();
            renderInfoList();
            alert('✅ Información eliminada.');
        }
    };

    document.getElementById('closeEditInfoModal').addEventListener('click', function() {
        document.getElementById('editInfoModal').classList.remove('show');
    });
    document.getElementById('editInfoModal').addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('show');
    });

    // ============================================================
    // 11. ADMIN TABS
    // ============================================================
    const tabBtns = document.querySelectorAll('#adminTabs button');
    const tabContents = {
        tabInicio: document.getElementById('tabInicio'),
        tabSlider: document.getElementById('tabSlider'),
        tabInfo: document.getElementById('tabInfo'),
        tabDisciplinas: document.getElementById('tabDisciplinas'),
        tabCategorias: document.getElementById('tabCategorias'),
        tabRegistrar: document.getElementById('tabRegistrar'),
        tabAtletas: document.getElementById('tabAtletas'),
        tabReportes: document.getElementById('tabReportes'),
        tabNoticias: document.getElementById('tabNoticias')
    };

    tabBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            if (this.classList.contains('hidden-tab')) return;
            tabBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            Object.keys(tabContents).forEach(key => {
                if (tabContents[key]) {
                    tabContents[key].classList.toggle('active', key === this.dataset.tab);
                }
            });
            if (this.dataset.tab === 'tabRegistrar') populateSelectors();
            if (this.dataset.tab === 'tabInicio') loadHomeForm();
            if (this.dataset.tab === 'tabInfo') { loadInfoForm();
                renderInfoList(); }
            if (this.dataset.tab === 'tabSlider') loadSliderForm();
            if (this.dataset.tab === 'tabAtletas') renderAdminAthletes();
            if (this.dataset.tab === 'tabNoticias') renderNoticias();
        });
    });

    // ============================================================
    // 12. SLIDER FORM
    // ============================================================
    function loadSliderForm() {
        const grid = document.getElementById('sliderImagesGrid');
        if (!grid) return;
        grid.innerHTML = data.sliderImages.map((img, i) => `
            <div class="slider-image-item">
                <span class="image-label">Diapositiva ${i + 1}</span>
                <img src="${img}" alt="Slide ${i + 1}" onerror="this.src='https://via.placeholder.com/400x200/1a2f52/4ade80?text=Slide${i+1}'" />
                <input type="file" accept="image/*" data-slide="${i}" class="slider-image-input" />
            </div>
        `).join('');
    }

    document.getElementById('saveSliderImages').addEventListener('click', function() {
        const inputs = document.querySelectorAll('.slider-image-input');
        let hasChanges = false;
        let loaded = 0;
        const totalInputs = inputs.length;

        if (totalInputs === 0) {
            document.getElementById('sliderFeedback').textContent = '⚠️ No hay imágenes para actualizar.';
            return;
        }

        inputs.forEach((input, i) => {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    data.sliderImages[i] = e.target.result;
                    loaded++;
                    if (loaded === totalInputs) {
                        saveData();
                        updateSliderImages();
                        document.getElementById('sliderFeedback').textContent = '✅ Imágenes del slider actualizadas.';
                        loadSliderForm();
                    }
                };
                reader.readAsDataURL(input.files[0]);
                hasChanges = true;
            } else {
                loaded++;
                if (loaded === totalInputs) {
                    if (!hasChanges) {
                        document.getElementById('sliderFeedback').textContent = '⚠️ No se seleccionaron imágenes.';
                    } else {
                        saveData();
                        updateSliderImages();
                        document.getElementById('sliderFeedback').textContent = '✅ Imágenes del slider actualizadas.';
                        loadSliderForm();
                    }
                }
            }
        });
    });

    // ============================================================
    // 13. ADMIN DATA
    // ============================================================
    function loadAdminData() {
        renderDisciplinas();
        renderCategorias();
        populateSelectors();
        loadHomeForm();
        loadInfoForm();
        loadSliderForm();
        renderAdminAthletes();
        renderNoticias();
        renderInfoList();
        updateAdminTabs();
    }

    function updateAdminTabs() {
        const allTabs = document.querySelectorAll('#adminTabs button');

        if (currentRole === 'coordinator') {
            allTabs.forEach(tab => {
                const tabId = tab.dataset.tab;
                if (tabId === 'tabRegistrar') {
                    tab.classList.remove('hidden-tab');
                } else {
                    tab.classList.add('hidden-tab');
                }
            });
        } else {
            allTabs.forEach(tab => {
                tab.classList.remove('hidden-tab');
            });
        }

        const visibleTabs = document.querySelectorAll('#adminTabs button:not(.hidden-tab)');
        if (visibleTabs.length > 0) {
            visibleTabs.forEach(t => t.classList.remove('active'));
            visibleTabs[0].classList.add('active');
            const firstTab = visibleTabs[0].dataset.tab;
            Object.keys(tabContents).forEach(key => {
                if (tabContents[key]) {
                    tabContents[key].classList.toggle('active', key === firstTab);
                }
            });
        }
    }

    function renderAthletes() {
        const container = document.getElementById('athleteDisplay');

        const zonaFilter = document.getElementById('filterZona')?.value || '';
        const disFilter = document.getElementById('filterDisciplina')?.value || '';

        let filtered = data.atletas || [];
        if (zonaFilter) filtered = filtered.filter(a => a.zona === zonaFilter);
        if (disFilter) filtered = filtered.filter(a => a.disciplina === disFilter);

    // ============================================================

    // ============================================================
    function getAthletesByZona(zona) {
        if (!zona) return data.atletas || [];
        return (data.atletas || []).filter(a => a.zona === zona);
    }

    function generateReportData(zona) {
        const athletes = getAthletesByZona(zona);
        return athletes.map(a => ({
            'Nombre': a.nombre || '',
            'Apellido': a.apellido || '',
            'Edad': a.edad || '',
            'Cédula': a.cedula || '',
            'Categoría': a.categoria || '',
            'Disciplina': a.disciplina || '',
            'Zona': a.zona || ''
        }));
    }

    document.getElementById('downloadExcel')?.addEventListener('click', function() {
        const zona = document.getElementById('reportZona')?.value || '';
        const zonaLabel = zona || 'Todas';
        const dataExcel = generateReportData(zona);

        if (dataExcel.length === 0) {
            document.getElementById('reportFeedback').textContent = `⚠️ No hay atletas en ${zonaLabel}.`;
            return;
        }

        try {
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(dataExcel);
            XLSX.utils.book_append_sheet(wb, ws, 'Atletas');
            XLSX.writeFile(wb, `Atletas_${zonaLabel}_${new Date().toISOString().slice(0,10)}.xlsx`);
            document.getElementById('reportFeedback').textContent = `✅ Excel de ${zonaLabel} descargado.`;
        } catch (e) {
            document.getElementById('reportFeedback').textContent = '❌ Error: ' + e.message;
        }
    });

    document.getElementById('downloadPDF')?.addEventListener('click', function() {
        const zona = document.getElementById('reportZona')?.value || '';
        const zonaLabel = zona || 'Todas';
        const athletes = getAthletesByZona(zona);

        if (athletes.length === 0) {
            document.getElementById('reportFeedback').textContent = `⚠️ No hay atletas en ${zonaLabel}.`;
            return;
        }

        try {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('landscape', 'mm', 'a4');
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();

            doc.setFontSize(18);
            doc.setTextColor(74, 222, 128);
            doc.text(`Reporte de Atletas - ${zonaLabel}`, pageWidth / 2, 20, { align: 'center' });
            doc.setTextColor(200, 200, 200);
            doc.setFontSize(10);
            doc.text(`Generado: ${new Date().toLocaleString()}`, pageWidth / 2, 28, { align: 'center' });

            const headers = ['Nombre', 'Apellido', 'Edad', 'Cédula', 'Categoría', 'Disciplina', 'Zona'];
            const colWidths = [30, 30, 15, 30, 25, 30, 25];
            let y = 38;
            doc.setFontSize(10);
            doc.setTextColor(74, 222, 128);

            let x = 10;
            headers.forEach((h, i) => {
                doc.text(h, x, y);
                x += colWidths[i];
            });

            doc.setTextColor(200, 200, 200);
            y += 6;

            athletes.forEach((a) => {
                if (y > pageHeight - 20) {
                    doc.addPage();
                    y = 20;
                }
                const row = [a.nombre || '', a.apellido || '', a.edad || '', a.cedula || '', a.categoria || '',
                    a.disciplina || '', a.zona || ''
                ];
                let xPos = 10;
                row.forEach((cell, i) => {
                    doc.text(String(cell), xPos, y);
                    xPos += colWidths[i];
                });
                y += 6;
            });

            doc.save(`Atletas_${zonaLabel}_${new Date().toISOString().slice(0,10)}.pdf`);
            document.getElementById('reportFeedback').textContent = `✅ PDF de ${zonaLabel} descargado.`;
        } catch (e) {
            document.getElementById('reportFeedback').textContent = '❌ Error: ' + e.message;
        }
    });

            data.noticias = data.noticias.filter(n => n.id !== id);
            saveData();
            renderNoticias();
            renderInfo();
            alert('✅ Noticia eliminada.');
        }
    };

    document.getElementById('newsForm').addEventListener('submit', function(e) {
        e.preventDefault();
        if (currentRole === 'coordinator') {
            alert('⚠️ Los coordinadores no pueden agregar noticias.');
            return;
        }

        const title = document.getElementById('newsTitle').value.trim();
        const content = document.getElementById('newsContent').value.trim();

        if (!title || !content) {
            alert('Completa todos los campos.');
            return;
        }

        const newNews = {
            id: nextNewsId++,
            title: title,
            content: content,
            date: new Date().toLocaleDateString()
        };

        data.noticias.push(newNews);
        saveData();
        renderNoticias();
        renderInfo();
        document.getElementById('newsForm').reset();
        alert('✅ Noticia agregada correctamente.');
    });

    // ============================================================
    // 27. MÚSICA
    // ============================================================
    let audio = null;
    let isMusicPlaying = false;

    function initMusic() {
        try {
            const musicUrl = 'https://github.com/tu-usuario/tu-repo/raw/main/himno-avcs.mp3';
            audio = new Audio(musicUrl);
            audio.loop = true;
            audio.volume = 0.5;

            const toggleBtn = document.getElementById('musicToggle');
            if (!toggleBtn) return;

            toggleBtn.addEventListener('click', function() {
                if (!audio) return;
                if (isMusicPlaying) {
                    audio.pause();
                    this.innerHTML = '<i class="fas fa-play"></i>';
                    isMusicPlaying = false;
                } else {
                    audio.play().catch(e => console.warn('Error al reproducir música:', e));
                    this.innerHTML = '<i class="fas fa-pause"></i>';
                    isMusicPlaying = true;
                }
            });

            audio.play().then(() => {
                isMusicPlaying = true;
                toggleBtn.innerHTML = '<i class="fas fa-pause"></i>';
            }).catch(() => {
                console.log('Autoplay bloqueado, esperando interacción del usuario');
            });

            document.addEventListener('click', function playOnInteraction() {
                if (audio && !isMusicPlaying) {
                    audio.play().then(() => {
                        isMusicPlaying = true;
                        const btn = document.getElementById('musicToggle');
                        if (btn) btn.innerHTML = '<i class="fas fa-pause"></i>';
                    }).catch(() => {});
                }
                document.removeEventListener('click', playOnInteraction);
            }, { once: true });

        } catch (e) {
            console.warn('Error al inicializar música:', e);
        }
    }

    // ============================================================
    // 28. INICIALIZAR - VERSIÓN SIMPLIFICADA
    // ============================================================
    function initializeApp() {
        console.log('🚀 Iniciando aplicación...');

        loadDataFromLocalStorage();

        applyHomeContent();
        renderInfo();
        renderAthletes();
        populateSelectors();
        loadAdminData();
        updateSliderImages();

        if (firebaseReady) {
            loadDataFromFirebase(() => {
                applyHomeContent();
                renderInfo();
                renderAthletes();
                populateSelectors();
                loadAdminData();
                updateSliderImages();
                setTimeout(() => {
                    listenFirebaseChanges();
                }, 1000);
            });
        }

        document.querySelector('a[data-section="admin"]')?.addEventListener('click', function(e) {
            e.preventDefault();
            if (!isAdmin) {
                loginModal.classList.add('show');
                return;
            }
            showSection('admin');
            loadAdminData();
        });

        initMusic();
        console.log('✅ Aplicación inicializada correctamente');
    }

    initializeApp();
</script>
